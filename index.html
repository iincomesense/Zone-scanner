<!DOCTYPE html>
<html>
<head>
    <title>TERMINAL</title>
    <style>
        body { background: #000; color: #fff; font-family: 'JetBrains Mono', monospace; padding: 10px; font-size: 12px; }
        .grid-box { border: 1px solid #111; padding: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        a { color: #fff; text-decoration: none; font-weight: bold; }
        a:hover { color: #3b82f6; }
        .green { color: #00ff88; } .red { color: #ff4d4d; }
        .label { color: #555; font-size: 10px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div style="border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 20px;">
        <span style="font-weight: bold; font-size: 14px;">INSTITUTIONAL HUB</span>
        <span style="float: right; color: #444;">8 AM - 11:30 PM ACTIVE</span>
    </div>

    {% for t in trades %}
    <div class="grid-box">
        <div style="width: 25%;">
            <a href="{{ t.link }}" target="_blank">{{ t.symbol }}</a><br>
            <span class="label">Limit Order</span>
        </div>
        <div><span class="label">Entry</span><br>{{ t.entry }}</div>
        <div><span class="label">SL</span><br><span class="red">{{ t.sl }}</span></div>
        <div><span class="label">TP</span><br><span class="green">{{ t.tp }}</span></div>
        <div><span class="label">Qty</span><br>{{ t.qty }}</div>
    </div>
    {% endfor %}
</body>
</html>
