- name: Commit & Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # अगर फाइल बनी है तभी उसे ऐड और कमिट करें
          if [ -f results.csv ]; then
            git add results.csv
            git commit -m "Auto-update trades: $(date)"
            git push
          else
            echo "कोई ट्रेड नहीं मिला, इसलिए फाइल नहीं बनाई गई।"
          fi
