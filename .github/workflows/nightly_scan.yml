name: Institutional Master Schedule
on:
  schedule:
    - cron: '30 15 * * *' # 9 PM AI Summary (IST)
    - cron: '00 16 * * *' # 9:30 PM Scan (IST)
    - cron: '00 18 * * *' # 11:30 PM Cleanup (IST)
  workflow_dispatch:

jobs:
  trade_ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python
        uses: actions/setup-python@v2
        with: {python-version: '3.9'}
      - name: Install deps
        run: pip install yfinance pandas fastapi uvicorn jinja2 numpy
      - name: Run Operation
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          # रात 9:30 बजे (UTC 16:00) स्कैन रन करना
          python main_scanner.py
          # रात 11:30 बजे (UTC 18:00) डेटा क्लियर करना
          if [ "$(date +%H)" == "18" ]; then rm -f results.json; fi
      - name: Push Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "System Sync: $(date)" || exit 0
          git push
