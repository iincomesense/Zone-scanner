name: Nightly Algo Scan
on:
  schedule:
    - cron: '30 15 * * *' # हर रात 9:30 PM IST (4 PM UTC)
  workflow_dispatch: # मैन्युअल चलाने का बटन

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install yfinance pandas tqdm fastapi uvicorn jinja2 numpy

      - name: Run Scan Logic
        run: |
          python main_scanner.py

      - name: Commit & Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # चेक करें कि क्या फाइल बनी है और उसमें डेटा है
          if [ -f results.csv ] && [ -s results.csv ]; then
            git add results.csv
            git commit -m "Auto-update trades: $(date)"
            git push
          else
            echo "सूचना: आज कोई नया 'Explosive' सिग्नल नहीं मिला, इसलिए फाइल अपडेट नहीं की गई।"
          fi
